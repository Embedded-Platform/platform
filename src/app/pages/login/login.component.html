<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card w-50">
    <div class="row g-0">
      <div class="col-md-6 d-flex align-items-center justify-content-center">
        <h2 class="text-white">Welcome mario</h2>
      </div>
      <div class="col-md-6">
        <form class="p-4" [formGroup]="loginForm" (ngSubmit)="auth()">
          <div class="mb-3">
            <label for="_username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="_username" formControlName="username">
          </div>
          <div class="mb-3">
            <label for="_password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="_password" formControlName="password">
          </div>
          <button type="submit" class="btn btn-success w-100">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
