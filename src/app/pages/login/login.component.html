<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <h2 class="text-primary fw-bold">E Platform</h2>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="auth()">
      <div class="mb-3">
        <label for="_username" class="form-label fw-bold">Usuario</label>
        <input type="text" class="form-control" id="_username" formControlName="username">
      </div>
      <div class="mb-3">
        <label for="_password" class="form-label fw-bold">Contraseña</label>
        <input type="password" class="form-control" id="_password" formControlName="password">
      </div>
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </div>
    </form>
  </div>
</div>
