name: Deploy Angular App (FrontEnd) to AWS

# Figura 10.16 - Pipeline del FrontEnd.
# Cambia respecto del original: en vez de SCP+SSH + configurar NGINX en UNA EC2,
# publica el build como artefacto (dist.zip) en S3 y dispara un Instance Refresh
# del Auto Scaling Group. Las instancias del ASG instalan NGINX y bajan el zip en
# su UserData (ver infra/cloudformation/platform.yaml en el repo del backend).

on:
  push:
    branches: [master, platform]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (production)
        run: npx ng build --configuration production

      - name: Package build
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload artifact to S3
        run: aws s3 cp dist.zip "s3://${{ secrets.ARTIFACTS_BUCKET }}/frontend/dist.zip"

      - name: Trigger rolling deploy (ASG instance refresh)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ secrets.FRONTEND_ASG_NAME }}" \
            --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":120}'

      - name: Wait for instance refresh to finish
        run: |
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ secrets.FRONTEND_ASG_NAME }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Instance refresh: $STATUS"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled) exit 1 ;;
            esac
            sleep 30
          done
          echo "Timeout esperando el instance refresh"; exit 1
